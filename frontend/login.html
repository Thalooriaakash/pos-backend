<!DOCTYPE html>
<html>
<head>
    <title>Login</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
            background: #f5f6fa;
        }

        .login-container {
            width: 320px;
            margin: 120px auto;
            padding: 25px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            text-align: center;
        }

        input {
            width: 90%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            width: 100%;
            padding: 10px;
            background: #2f3542;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #57606f;
        }

        .link {
            color: blue;
            cursor: pointer;
            font-size: 14px;
        }

        .hidden {
            display: none;
        }
    </style>
</head>

<body>

<div class="login-container">

    <!-- 🔐 LOGIN -->
    <div id="loginBox">
        <h2>🔐 Login</h2>

        <input id="name" placeholder="Username">
        <input id="password" type="password" placeholder="Password">

        <button onclick="login()">Login</button>

        <p class="link" onclick="showForgot()">Forgot Password?</p>
    </div>

    <!-- 📧 FORGOT PASSWORD -->
    <div id="forgotBox" class="hidden">
        <h2>📧 Forgot Password</h2>

        <input id="email" placeholder="Enter Email">
        <button onclick="sendOTP()">Send OTP</button>

        <p class="link" onclick="showLogin()">Back to Login</p>
    </div>

    <!-- 🔑 RESET PASSWORD -->
    <div id="resetBox" class="hidden">
        <h2>🔑 Reset Password</h2>

        <input id="otp" placeholder="Enter OTP">
        <input id="newPassword" type="password" placeholder="New Password">

        <button onclick="resetPassword()">Reset</button>
    </div>

</div>

<script>

const API = "http://localhost:5000";

// 🔐 LOGIN
function login(){
    const nameInput = document.getElementById("name").value;
    const passwordInput = document.getElementById("password").value;

    fetch(API + "/auth/login",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({
            name: nameInput,
            password: passwordInput
        })
    })
    .then(r => r.json())
    .then(d => {

        if(d.token){

            localStorage.setItem("token", d.token);

            const payload = JSON.parse(atob(d.token.split(".")[1]));

            if(payload.role === "admin"){
                window.location = "dashboard.html";
            }
            else{
                window.location = "orders.html";
            }

        } else {
            alert(d.message);
        }

    });
}


// 📧 SHOW FORGOT
function showForgot(){
    document.getElementById("loginBox").classList.add("hidden");
    document.getElementById("forgotBox").classList.remove("hidden");
}

// 🔙 BACK
function showLogin(){
    document.getElementById("forgotBox").classList.add("hidden");
    document.getElementById("resetBox").classList.add("hidden");
    document.getElementById("loginBox").classList.remove("hidden");
}

// 📧 SEND OTP
function sendOTP(){

    const email = document.getElementById("email").value;

    fetch(API + "/auth/forgot",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({ email })
    })
    .then(r=>r.json())
    .then(d=>{
        alert(d.message);

        document.getElementById("forgotBox").classList.add("hidden");
        document.getElementById("resetBox").classList.remove("hidden");
    });
}

// 🔑 RESET PASSWORD
function resetPassword(){

    const email = document.getElementById("email").value;
    const otp = document.getElementById("otp").value;
    const newPassword = document.getElementById("newPassword").value;

    fetch(API + "/auth/reset",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({
            email,
            otp,
            newPassword
        })
    })
    .then(r=>r.json())
    .then(d=>{
        alert(d.message);
        showLogin();
    });
}

</script>

</body>
</html>

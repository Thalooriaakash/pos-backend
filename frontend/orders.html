<!DOCTYPE html>
<html>
<head>
<title>Orders</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#f1f2f6;
}

/* SIDEBAR */
.sidebar{
    width:220px;
    background:#2f3542;
    color:white;
    height:100vh;
    position:fixed;
    padding-top:20px;
}

.sidebar a{
    display:block;
    color:white;
    padding:12px;
    text-decoration:none;
}

.sidebar a:hover{
    background:#57606f;
}

/* LAYOUT */
.container{
    margin-left:230px;
    display:flex;
}

/* LEFT SIDE */
.products-section{
    flex:3;
    padding:20px;
}

.products-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(200px,1fr));
    gap:15px;
}

/* PRODUCT CARD */
.product-card{
    background:white;
    padding:15px;
    border-radius:12px;
    box-shadow:0 2px 8px rgba(0,0,0,0.1);
    transition:0.3s;
    cursor:pointer;
}

.product-card:hover{
    transform:translateY(-5px);
}

.product-card img{
    width:100%;
    height:120px;
    object-fit:cover;
    border-radius:8px;
}

.product-card h3{
    margin:5px 0;
}

.product-card p{
    margin:3px 0;
    font-size:14px;
}

/* CART */
.cart-section{
    flex:1;
    background:white;
    height:100vh;
    position:sticky;
    top:0;
    padding:15px;
    border-left:1px solid #ddd;
    display:flex;
    flex-direction:column;
}

/* ✅ NEW */
.total-box{
    border-top:1px solid #ddd;
    padding-top:10px;
    position:sticky;
    bottom:0;
    background:white;
}

.place-btn{
    width:100%;
    padding:12px;
    background:#2ed573;
    border:none;
    color:white;
    border-radius:6px;
    font-size:16px;
    cursor:pointer;
    position:sticky;
    bottom:10px;
}
.cart-items{
    flex:1;
    overflow:auto;
}

.cart-item{
    border-bottom:1px solid #eee;
    padding:10px 0;
}

.qty-controls{
    display:flex;
    margin-top:5px;
}

.qty-btn{
    background:#1e90ff;
    color:white;
    border:none;
    padding:5px 8px;
    margin:0 5px;
    border-radius:4px;
    cursor:pointer;
}

.total-box{
    border-top:1px solid #ddd;
    padding-top:10px;
}

.place-btn{
    width:100%;
    padding:12px;
    background:#2ed573;
    border:none;
    color:white;
    border-radius:6px;
    font-size:16px;
    cursor:pointer;
}

/* DISABLED */
.disabled{
    opacity:0.5;
    pointer-events:none;
}

.out-badge{
    background:red;
    color:white;
    padding:5px;
    text-align:center;
    border-radius:5px;
    margin-top:5px;
    font-size:12px;
}
/* 🔥 BLINK EFFECT */
.blink-search{
    animation: blinkBorder 0.6s 2;
}

@keyframes blinkBorder{
    0%{ border:2px solid #1e90ff; }
    50%{ border:2px solid transparent; }
    100%{ border:2px solid #1e90ff; }
}

</style>

</head>

<body>

<div id="navbar"></div>

<div class="container">

<!-- PRODUCTS -->
<div class="products-section">
    <h2>🍽 Menu</h2>

<input 
type="text" 
id="searchInput" 
placeholder="🔍 Search menu..."
onkeyup="filterProducts()"
style="width:100%; padding:10px; margin-bottom:15px;">

<div class="products-grid" id="products"></div>
</div>

<!-- CART -->
<div class="cart-section">
    <h3>🛒 Cart</h3>

    <div class="cart-items" id="cart"></div>

    <div class="total-box">
        <h3>Total: ₹<span id="total">0</span></h3>
        <button class="place-btn" onclick="placeOrder()">Place Order</button>
    </div>
</div>

</div>

<script>
const API = "http://localhost:5000";
const token = localStorage.getItem("token");

if (!token) window.location = "login.html";

let cart = [];
let allProducts = [];

// NAVBAR
fetch("navbar.html")
.then(r=>r.text())
.then(d=>{
document.getElementById("navbar").innerHTML = d;
});

// ✅ LOAD PRODUCTS
function loadProducts(){

fetch(API + "/products", {
headers: {
Authorization: "Bearer " + token
}
})
.then(r => r.json())
.then(data => {

    if(data.message){
        alert(data.message);
        return;
    }

    allProducts = data;
    displayProducts(data);
})
.catch(err => {
    console.error("LOAD PRODUCTS ERROR:", err);
});
}

// ✅ DISPLAY PRODUCTS
function displayProducts(data){

const productsDiv = document.getElementById("products");
productsDiv.innerHTML = "";

data.forEach(p=>{

// ✅ CHECK DISABLED
const isDisabled = !p.is_available;

// ✅ CHECK STOCK (ONLY DIRECT)
const isOut = p.type === "direct" && (p.stock || 0) <= 0;

// ✅ FINAL BLOCK
const block = isDisabled || isOut;

productsDiv.innerHTML += `
<div class="product-card ${block ? "disabled" : ""}" 
${block ? "" : `onclick="add(${p.id},'${p.name}',${p.price})"`}>

${p.image ? `<img src="${p.image}">` : ""}

<h3>${p.name}</h3>
<p>₹${p.price}</p>

${p.type === "direct" ? `<p>Stock: ${p.stock || 0}</p>` : ""}

${isDisabled ? `<div class="out-badge">Not Available</div>` : ""}
${(!isDisabled && isOut) ? `<div class="out-badge">Out of Stock</div>` : ""}

</div>
`;
});
}

// ✅ SEARCH
function filterProducts(){
const search = document.getElementById("searchInput").value.toLowerCase();

const filtered = allProducts.filter(p =>
(p.name || "").toLowerCase().includes(search)
);

displayProducts(filtered);
}

// ✅ ADD TO CART
function add(id,name,price){

const item = cart.find(i=>i.product_id===id);

if(item){
item.quantity++;
}else{
cart.push({product_id:id,name,price,quantity:1});
}

renderCart();

/* ✅ BLINK SEARCH BAR */
const search = document.getElementById("searchInput");

search.focus(); // cursor back
search.classList.add("blink-search");

setTimeout(()=>{
search.classList.remove("blink-search");
},600);

}

// ✅ CART
function renderCart(){

const cartDiv = document.getElementById("cart");
cartDiv.innerHTML="";

let total = 0;

cart.forEach((i,index)=>{
total += i.price * i.quantity;

cartDiv.innerHTML+=`
<div class="cart-item">
<b>${i.name}</b><br>
₹${i.price} x ${i.quantity}

<div class="qty-controls">
<button class="qty-btn" onclick="inc(${index})">+</button>
<button class="qty-btn" onclick="dec(${index})">-</button>
</div>
</div>
`;
});

document.getElementById("total").innerText = total;
}

// ➕ ➖
function inc(i){ cart[i].quantity++; renderCart(); }
function dec(i){
cart[i].quantity--;
if(cart[i].quantity<=0) cart.splice(i,1);
renderCart();
}

// ✅ PLACE ORDER
function placeOrder(){

if(cart.length===0){
alert("Cart empty");
return;
}

fetch(API + "/orders",{
method:"POST",
headers:{
"Content-Type":"application/json",
Authorization:"Bearer "+token
},
body:JSON.stringify({items:cart})
})
.then(r=>r.json())
.then(d=>{
window.location="bill.html?id="+d.orderId;
});
}

// INIT
loadProducts();

</script>

</body>
</html>

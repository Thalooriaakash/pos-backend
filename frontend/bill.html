<!DOCTYPE html>
<html>
<head>
    <title>Bill</title>
    
    <style>
@media print {

    body * {
        visibility: hidden;
    }

    #invoice, #invoice * {
        visibility: visible;
    }

    #invoice {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
    }

    button, select {
        display: none;
    }
    table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 10px;
}

th, td {
    border-bottom: 1px dashed #ccc;
    padding: 5px;
    text-align: center;
}

th {
    font-weight: bold;
}

td:first-child {
    text-align: left;
}
}
</style>

    <!-- ✅ jsPDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
    <div id="navbar"></div>
<!-- 🧾 RECEIPT SETTINGS -->
<div style="text-align:center; margin-bottom:10px;">
    <label>Select Receipt Size:</label>

    <select id="receiptSize" onchange="changeSize()">
    <option value="3" selected>3 Inch (Thermal)</option>
    <option value="5">5 Inch</option>
    <option value="a4">A4</option>
</select>
</div>


<div id="invoice" style="background:white; padding:10px; margin:auto; font-size:12px;">
    <h2 style="text-align:center;">🍽️ Your Restaurant Name</h2>
    <p style="text-align:center;">Rajahmundry, Andhra Pradesh</p>

    <hr>

    <p><b>Order ID:</b> <span id="orderId"></span></p>
    <p><b>Date:</b> <span id="date"></span></p>
<table width="100%" style="border-collapse: collapse;">
        <thead>
            <tr>
                <th>Item</th>
                <th>Price</th>
                <th>Qty</th>
                <th>Total</th>
            </tr>
        </thead>
        <tbody id="items"></tbody>
    </table>

    <div style="text-align:right;">
        <p>Subtotal: ₹<span id="subtotal">0</span></p>
        <p>GST (5%): ₹<span id="gst">0</span></p>
        <h3>Grand Total: ₹<span id="total">0</span></h3>
    </div>

    <p style="text-align:center;">🙏 Thank You! Visit Again</p>

</div>
<div style="text-align:center; margin-top:10px;">
    <h4>💳 Payment Method</h4>

    <select id="paymentMethod">
        <option value="cash">Cash</option>
        <option value="upi">UPI</option>
        <option value="card">Card</option>
    </select>

    <br><br>

    <button onclick="confirmPayment()">✅ Confirm Payment</button>
</div>

<br>
<div style="text-align:center;">
    <button onclick="downloadPDF()">⬇ Download PDF</button>
    <button onclick="window.print()">🖨 Print</button>
</div>





<script>


const API = "http://localhost:5000";
const token = localStorage.getItem("token");

const params = new URLSearchParams(window.location.search);
const orderId = params.get("id");

// ✅ FIXED ELEMENTS
const orderIdEl = document.getElementById("orderId");
const itemsEl = document.getElementById("items");
const subtotalEl = document.getElementById("subtotal");
const gstEl = document.getElementById("gst");
const totalEl = document.getElementById("total");

fetch(`${API}/orders/${orderId}`,{
headers:{ Authorization:"Bearer "+token }
})
.then(r=>r.json())
.then(data=>{

orderIdEl.innerText = data.order.id;

let subtotal = 0;

itemsEl.innerHTML = "";

data.items.forEach(i=>{
const t = i.price * i.quantity;
subtotal += t;

itemsEl.innerHTML += `
<tr>
<td>${i.name}</td>
<td>${i.price}</td>
<td>${i.quantity}</td>
<td>${t}</td>
</tr>`;
});

const gst = subtotal * 0.05;
const total = subtotal + gst;

subtotalEl.innerText = subtotal.toFixed(2);
gstEl.innerText = gst.toFixed(2);
totalEl.innerText = total.toFixed(2);

});

// PAYMENT
function confirmPayment(){
const method = document.getElementById("paymentMethod").value;

fetch(`${API}/orders/${orderId}/payment`,{
method:"PUT",
headers:{
"Content-Type":"application/json",
Authorization:"Bearer "+token
},
body:JSON.stringify({method})
})
.then(()=>alert("Payment Done"));
}

function changeSize(){
    const size = document.getElementById("receiptSize").value;
    const invoice = document.getElementById("invoice");

    if(size === "3"){
        invoice.style.width = "250px";
        invoice.style.fontSize = "12px";
    }
    else if(size === "5"){
        invoice.style.width = "400px";
        invoice.style.fontSize = "14px";
    }
    else{
        invoice.style.width = "800px";
        invoice.style.fontSize = "16px";
    }
}
window.onload = function(){
    changeSize(); // apply default size
};

</script>

</body>

</html>

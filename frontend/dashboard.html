<!DOCTYPE html>
<html>
<head>
<title>Dashboard</title>
<link rel="stylesheet" href="style.css">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
.cards{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
    gap:15px;
}

.card{
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0 0 8px rgba(0,0,0,0.1);
}

.section{
    margin-top:20px;
    background:white;
    padding:15px;
    border-radius:10px;
}
</style>

</head>

<body>

<div class="sidebar">
    <h2 style="text-align:center;">🍽 POS</h2>

    <a href="dashboard.html">Dashboard</a>
    <a href="products.html">Products</a>
    <a href="orders.html">Orders</a>
    <a href="inventory.html">Inventory</a>
    <a href="reports.html">Reports</a>
    <a href="liveorders.html">Live Orders</a>
<a href="users.html">Users</a>

    <hr>

    <button onclick="logout()" style="margin:10px;">Logout</button>
</div>

<div class="main">

<h2>📊 Dashboard</h2>

<!-- CARDS -->
<div class="cards">
<div class="card">
<h3>Today Orders</h3>
<p id="todayOrders">0</p>
</div>

<div class="card">
<h3>Today Revenue</h3>
<p>₹<span id="todayRevenue">0</span></p>
</div>
</div>

<!-- LOW STOCK -->
<div class="section">
<h3>⚠ Low Stock</h3>
<ul id="lowStock"><li>Loading...</li></ul>
</div>

<!-- RECENT ORDERS -->
<div class="section">
<h3>🧾 Recent Orders</h3>
<ul id="recentOrders"><li>Loading...</li></ul>
</div>

<!-- GRAPH -->
<div class="section">
<h3>📈 Sales Graph</h3>

<input type="date" id="datePicker" style="padding:8px;margin-bottom:10px;">
<select id="typeSelect" style="padding:8px;">
    <option value="orders">Orders</option>
    <option value="revenue">Revenue</option>
</select>

<canvas id="salesChart"></canvas>
</div>

<!-- TOP PRODUCTS -->
<div class="section">
<h3>🔥 Top Selling Items</h3>
<ul id="topProducts"><li>Loading...</li></ul>
</div>

</div>

<script>
const API = "http://localhost:5000";
const token = localStorage.getItem("token");

if(!token) window.location = "login.html";

// ✅ TODAY SALES
fetch(API+"/orders/sales",{
headers:{ Authorization:"Bearer "+token }
})
.then(r=>r.json())
.then(d=>{
document.getElementById("todayOrders").innerText = d.todayOrders || 0;
document.getElementById("todayRevenue").innerText = d.todayRevenue || 0;
});

// ✅ LOW STOCK
fetch(API+"/ingredients",{ headers:{ Authorization:"Bearer "+token }})
.then(r=>r.json())
.then(data=>{
const ul = document.getElementById("lowStock");
ul.innerHTML="";

const low = data.filter(i=>Number(i.stock)<=Number(i.minQty||0));

if(low.length===0){
ul.innerHTML="<li>No low stock</li>";
return;
}

low.forEach(i=>{
ul.innerHTML += `<li>${i.name} (${i.stock})</li>`;
});
});

// ✅ 🔥 FIXED RECENT ORDERS
fetch(API+"/orders/recent",{ headers:{ Authorization:"Bearer "+token }})
.then(r=>r.json())
.then(data=>{
const ul=document.getElementById("recentOrders");
ul.innerHTML="";

if(!Array.isArray(data) || data.length===0){
ul.innerHTML="<li>No recent orders</li>";
return;
}

// ⚠ FIX: your backend returns only id & total_amount
data.forEach(o=>{
ul.innerHTML+=`<li>Order #${o.id}-items (${o.items}) - ₹${o.total_amount}</li>`;
});
}) 
.catch(()=>{
document.getElementById("recentOrders").innerHTML="<li>Error loading</li>";
});

// ✅ GRAPH
let chart;

function loadGraph(date){

fetch(API+"/orders/sales-graph/"+date,{
headers:{ Authorization:"Bearer "+token }
})
.then(r=>r.json())
.then(data=>{

let labels=[], values=[];
let type = document.getElementById("typeSelect").value;

// 24 hours
for(let i=0;i<24;i++){
labels.push(i+":00");
values.push(0);
}

data.forEach(d=>{
values[d.hour] = type==="orders" ? d.orders : d.revenue;
});

if(chart) chart.destroy();

const ctx = document.getElementById("salesChart").getContext("2d");

chart = new Chart(ctx,{
type:"line",
data:{
labels:labels,
datasets:[{
label:type==="orders"?"Orders":"Revenue",
data:values,
fill:true,
tension:0.3
}]
},
options:{
responsive:true,
scales:{
y:{ beginAtZero:true }
}
}
});

})
.catch(()=>{
console.log("Graph error");
});
}

// DATE
const today = new Date().toISOString().split("T")[0];
document.getElementById("datePicker").value = today;

loadGraph(today);

// CHANGE EVENTS
document.getElementById("datePicker").onchange = ()=>{
loadGraph(document.getElementById("datePicker").value);
loadTop(document.getElementById("datePicker").value);
};

document.getElementById("typeSelect").onchange = ()=>{
loadGraph(document.getElementById("datePicker").value);
};

// ✅ TOP PRODUCTS
// ✅ TOP PRODUCTS (FIXED)
function loadTop(date){
fetch(API + "/orders/top-products/" + date, {
headers:{ Authorization:"Bearer " + token }
})
.then(r => r.json())
.then(data => {

const ul = document.getElementById("topProducts");
ul.innerHTML = "";

// ✅ CHECK EMPTY
if(!Array.isArray(data) || data.length === 0){
ul.innerHTML = "<li>No data</li>";
return;
}

// ✅ LOOP DATA
data.forEach(p => {

// 🔥 FIX: handle different backend keys safely
const name = p.name || p.product_name || "Unknown Item";
const qty = p.total_qty || p.qty || 0;

ul.innerHTML += `
<li>
${name} (x${qty})
</li>
`;

});

})
.catch(() => {
document.getElementById("topProducts").innerHTML = "<li>Error loading</li>";
});
}

loadTop(today);

// ✅ LOGOUT
function logout(){
localStorage.removeItem("token");
window.location="login.html";
}

</script>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
<title>Products</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#f5f6fa;
}

/* SIDEBAR */
.sidebar{
    width:220px;
    background:#2f3542;
    color:white;
    height:100vh;
    position:fixed;
    padding-top:20px;
}

.sidebar a{
    display:block;
    color:white;
    padding:12px;
    text-decoration:none;
}

.sidebar a:hover{
    background:#57606f;
}

/* MAIN */
.main{
    margin-left:230px;
    padding:20px;
}

/* FORM */
.form-box{
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,0.1);
    margin-bottom:20px;
}

.form-box input, .form-box select{
    padding:10px;
    margin:5px;
    border:1px solid #ccc;
    border-radius:5px;
}

.form-box button{
    padding:10px 15px;
    background:#2ed573;
    border:none;
    color:white;
    border-radius:5px;
    cursor:pointer;
}

/* GRID */
.product-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
    gap:15px;
}

/* CARD */
.product-card{
    background:white;
    padding:15px;
    border-radius:10px;
    box-shadow:0 0 8px rgba(0,0,0,0.1);
}

.product-card img{
    width:100%;
    height:120px;
    object-fit:cover;
    border-radius:5px;
}

/* BADGES */
.badge{
    display:inline-block;
    padding:4px 8px;
    border-radius:5px;
    font-size:12px;
    color:white;
}

.badge-red{ background:red; }
.badge-black{ background:black; }

.actions{ margin-top:10px; }
button{ margin:3px; }
</style>

</head>

<body>

<div class="sidebar">
    <h2 style="text-align:center;">🍽 POS</h2>

    <a href="dashboard.html">Dashboard</a>
    <a href="products.html">Products</a>
    <a href="orders.html">Orders</a>
    <a href="inventory.html">Inventory</a>
    <a href="reports.html">Reports</a>
    <a href="liveOrders.html">Live Orders</a>
<a href="users.html">Users</a>
    <hr>
    <a href="login.html">Logout</a>
</div>

<div class="main">

<h2>📦 Products</h2>

<div class="form-box">

<input id="name" placeholder="Product Name">
<input id="price" type="number" placeholder="Price">
<input id="stock" type="number" placeholder="Stock">
<input id="min_stock" type="number" placeholder="Minimum Stock">

<select id="type">
    <option value="direct">Ready Product</option>
    <option value="recipe">Recipe Product</option>
</select>

<!-- ✅ RECIPE SECTION -->
<div id="recipeSection" style="display:none; margin-top:10px;">
<h4>🧪 Ingredients</h4>

<!-- 🔍 SEARCH BAR -->
<input type="text" id="ingredientSearch" placeholder="Search ingredient..." onkeyup="filterIngredients()">

<select id="ingredientSelect"></select>
<input type="number" id="ingredientQty" placeholder="Quantity">

<button type="button" onclick="addIngredient()">Add Ingredient</button>

<ul id="ingredientList"></ul>
</div>

<input type="file" id="image">
<button onclick="addProduct()">Add Product</button>

</div>

<input 
type="text" 
id="searchInput" 
placeholder="🔍 Search products..."
onkeyup="filterProducts()"
style="width:100%; padding:10px; margin-bottom:15px;">

<div id="list" class="product-grid"></div>

</div>

<script>

const API = "http://localhost:5000";
const token = localStorage.getItem("token");

if (!token) window.location = "login.html";

let allProducts = [];
let allIngredients = [];
let recipe = [];

/* ================= DISPLAY PRODUCTS ================= */
function displayProducts(data){

const list = document.getElementById("list");
list.innerHTML = "";

data.forEach(p => {

let badge = "";
if(!p.is_available){
badge = `<span class="badge badge-black">Not Available</span>`;
}

list.innerHTML += `
<div class="product-card">

${p.image ? `<img src="${p.image}">` : ""}

<h3>${p.name || "Unnamed Product"}</h3>
<p>₹${p.price}</p>
<p>${p.type}</p>

${badge}

${p.type === "direct" ? `
<p>📦 Stock: ${p.stock}g</p>
<p>⚠ Min: ${p.min_stock}</p>
` : `<p>🧪 Recipe Product</p>`}

<button onclick="viewIngredients(${p.id})">View Ingredients</button>

<div class="actions">
<button onclick="editProduct(${p.id}, \`${p.name}\`, ${p.price}, ${p.stock}, ${p.min_stock})">Edit</button>
<button onclick="del(${p.id})">Delete</button>
<button onclick="toggleProduct(${p.id})">
${p.is_available ? "Disable" : "Enable"}
</button>
</div>

</div>`;
});
}

/* ================= LOAD PRODUCTS ================= */
function loadProducts(){
fetch(API+"/products",{
headers:{ Authorization:"Bearer "+token }
})
.then(r=>r.json())
.then(data=>{
allProducts = data;
displayProducts(data);
});
}

/* ================= ADD PRODUCT ================= */
function addProduct(){

const name = document.getElementById("name").value.trim();

if(!name){
alert("Enter product name");
return;
}

if(type.value === "recipe" && recipe.length === 0){
alert("Add ingredients");
return;
}

const formData = new FormData();

formData.append("name", name);
formData.append("price", price.value);
formData.append("type", type.value);
formData.append("stock", stock.value || 0);
formData.append("min_stock", min_stock.value || 0);

if(type.value === "recipe"){
formData.append("recipe", JSON.stringify(recipe));
}

if(image.files[0]){
formData.append("image", image.files[0]);
}

fetch(API+"/products",{
method:"POST",
headers:{ Authorization:"Bearer "+token },
body:formData
})
.then(r=>r.json())
.then(d=>{
alert(d.message);

recipe = [];
ingredientList.innerHTML = "";

loadProducts();
});
}

/* ================= INGREDIENT LOAD ================= */
function loadIngredients(){
fetch(API+"/ingredients",{
headers:{ Authorization:"Bearer "+token }
})
.then(r=>r.json())
.then(data=>{
allIngredients = data;
renderIngredientDropdown(data);
});
}

function renderIngredientDropdown(data){
ingredientSelect.innerHTML="";
data.forEach(i=>{
ingredientSelect.innerHTML += `
<option value="${i.id}">
${i.name} (${i.stock}g)
</option>`;
});
}

/* ================= SEARCH INGREDIENT ================= */
function filterIngredients(){
const text = document.getElementById("ingredientSearch").value.toLowerCase();

const filtered = allIngredients.filter(i =>
(i.name || "").toLowerCase().includes(text)
);

renderIngredientDropdown(filtered);
}

/* ================= ADD INGREDIENT ================= */
function addIngredient(){

const id = ingredientSelect.value;
const qty = ingredientQty.value;

if(!qty){
alert("Enter quantity");
return;
}

recipe.push({ id, qty });

renderIngredients();
ingredientQty.value="";
}

function renderIngredients(){
ingredientList.innerHTML="";
recipe.forEach((i,index)=>{
ingredientList.innerHTML += `
<li>
Ingredient ID: ${i.id} - Qty: ${i.qty}
<button onclick="removeIngredient(${index})">X</button>
</li>`;
});
}

function removeIngredient(index){
recipe.splice(index,1);
renderIngredients();
}

/* ================= VIEW INGREDIENTS ================= */
function viewIngredients(id){
fetch(API+"/products/"+id+"/ingredients",{
headers:{ Authorization:"Bearer "+token }
})
.then(r=>r.json())
.then(data=>{
let text = "🧪 Ingredients:\n\n";

data.forEach(i=>{
text += `${i.name} - ${i.quantity} ${i.unit}\n`;
});

alert(text);
});
}

/* ================= TOGGLE ================= */
function toggleProduct(id){
fetch(API+"/products/"+id+"/toggle",{
method:"PUT",
headers:{ Authorization:"Bearer "+token }
})
.then(()=>loadProducts());
}

/* ================= DELETE ================= */
function del(id){
fetch(API+"/products/"+id,{
method:"DELETE",
headers:{ Authorization:"Bearer "+token }
}).then(()=>loadProducts());
}

/* ================= SEARCH ================= */
function filterProducts(){
const text = document.getElementById("searchInput").value.toLowerCase();

const filtered = allProducts.filter(p =>
(p.name || "").toLowerCase().includes(text)
);

displayProducts(filtered);
}

/* ================= TYPE CHANGE ================= */
type.addEventListener("change", ()=>{
recipeSection.style.display = type.value === "recipe" ? "block" : "none";

if(type.value === "recipe"){
loadIngredients();
}
});

/* INIT */
loadProducts();

</script>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
<title>Live Orders</title>

<link rel="stylesheet" href="style.css">

<style>
.container{
    margin-left:230px;
    padding:20px;
}

ul{
    background:white;
    padding:15px;
    border-radius:10px;
    list-style:none;
}

li{
    padding:10px;
    border-bottom:1px solid #eee;
}
</style>

</head>

<body>

<!-- ✅ SAME SIDEBAR -->
<div id="navbar"></div>

<div class="container">
    <h2>📡 Live Orders</h2>
    <ul id="orders"></ul>
</div>

<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>

<script>
const socket = io("http://localhost:5000");

socket.on("newOrder",(d)=>{
    document.getElementById("orders").innerHTML += `
        <li>🆕 Order ID: ${d.orderId}</li>
    `;
});
</script>

<script src="main.js"></script>

</body>
</html>
